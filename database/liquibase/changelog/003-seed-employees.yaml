  - changeSet:
      id: gather-initial-stats
      author: demo
      comment: >
        Gather stats while employees table has only 5 rows. The next changeset
        bulk-inserts ~500 more rows without re-gathering, leaving statistics
        intentionally stale for the DBA demo.
      changes:
        - sql:
            splitStatements: false
            sql: |
              BEGIN
                DBMS_STATS.GATHER_TABLE_STATS(USER, 'EMPLOYEES');
              END;
